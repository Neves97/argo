apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webcolor-ui-ingress
  namespace: webcolor
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: traefik
  rules:
    - host: webcolor.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webcolor-ui
                port:
                  number: 80
